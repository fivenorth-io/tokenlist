name: Validate tokenlist

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tokenlist
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tokenlist-base
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: tokenlist/go.sum
      - name: Test validator
        working-directory: tokenlist
        run: go test -race ./...
      - name: Validate PR metadata and stable keys
        if: github.event_name == 'pull_request'
        working-directory: tokenlist
        run: go run ./cmd/validate-assets -root . -base ../tokenlist-base
      - name: Validate merged metadata
        if: github.event_name != 'pull_request'
        working-directory: tokenlist
        run: go run ./cmd/validate-assets -root .
